<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PartRecon</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header class="site-header">

  <div class="logo">
    <span class="wm-part">Part</span>
    <div class="logo-dot"></div>
    <span class="wm-recon">Recon</span>
  </div>

  <nav class="header-nav">
    <button class="nav-btn active">Parts</button>
    <button class="nav-btn">Vehicles</button>
    <button class="nav-btn">About</button>
  </nav>

</header>

<!-- ── Search ──────────────────────────────────────────── -->
<div class="search-band">
  <div class="search-inner">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="search"
           placeholder="Search listings…"
           autocomplete="off" spellcheck="false" />
  </div>
</div>

<!-- ── Chassis filter ──────────────────────────────────── -->
<div class="filter-band">
  <div class="chassis-row">
    <button class="chassis-btn active">All</button>
    {% for code in chassis_filters %}
    <button class="chassis-btn">{{ code }}</button>
    {% endfor %}
  </div>
</div>

<!-- ── Page shell ──────────────────────────────────────── -->
<main>
  <!-- cards go here -->
</main>

<footer>
  PartRecon &mdash; Aggregating BMW parts across the web
</footer>

</body>
</html>
